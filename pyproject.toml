[project]
name = "agent-workbench"
version = "0.3.0"
description = "Personal, self-hosted Codex and Hermes activity workbench"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "argon2-cffi>=25.1,<27",
  "fastapi>=0.117,<1",
  "httpx>=0.28,<1",
  "psutil>=7.1,<8",
  "typer>=0.19,<1",
  "tzdata>=2025.2",
  "uvicorn>=0.36,<1",
]

[project.scripts]
awb = "awb.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
]
build = [
  "pyinstaller>=6.22,<7",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "awb"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
