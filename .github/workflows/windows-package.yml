name: Windows package
on:
  workflow_dispatch:
  push:
    branches:
      - codex/shared-memory-v1
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Test source
        run: |
          uv sync --frozen --extra memory-mcp
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          uv run --extra memory-mcp pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Source tests failed" }
          uv run --extra memory-mcp ruff check src tests
          if ($LASTEXITCODE -ne 0) { throw "Lint failed" }
      - name: Build installer and portable ZIP
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-workbench-windows
          path: |
            dist/AgentWorkbench-Setup-*-Windows-x64.exe
            dist/AgentWorkbench-Windows-portable-*.zip
          if-no-files-found: error
