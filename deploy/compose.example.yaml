services:
  agent-workbench:
    build:
      context: ..
      dockerfile: Dockerfile
    image: agent-workbench:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/data
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
